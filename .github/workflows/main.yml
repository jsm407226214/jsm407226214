# 工作流名称：生成贪吃蛇动画
name: generate animation

# 触发条件（什么时候自动运行）
on:
  # 自动执行：每24小时运行一次（自动更新贪吃蛇）
  schedule:
    - cron: "0 */24 * * *" 
  
  # 允许手动点击运行
  workflow_dispatch:
  
  # 当master分支有代码提交时，也自动运行一次
  push:
    branches:
    - master
    
# 执行任务
jobs:
  generate:
    runs-on: ubuntu-latest  # 运行环境（固定不用改）
    timeout-minutes: 10     # 最大超时时间（固定不用改）
    
    # 👇👇👇 就是加这一行！强制使用 Node.js 24，彻底消除警告
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      # 第一步：生成贪吃蛇动画（浅色+深色两张）
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}  # 自动获取你的GitHub用户名
          outputs: |
            dist/github-contribution-grid-snake.svg          # 浅色动画
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark  # 深色动画
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # 第二步：把生成的 SVG 推送到 output 分支供 README 调用
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4  # 已升级v4，无警告
        with:
          target_branch: output   # 推送到 output 分支
          build_dir: dist         # 从dist目录读取文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
