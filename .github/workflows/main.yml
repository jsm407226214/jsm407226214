# 工作流名称：生成贪吃蛇动画
name: generate animation

# 触发条件（什么时候自动运行）
on:
  # 自动执行：每24小时运行一次（自动更新贪吃蛇）
  schedule:
    - cron: "0 */24 * * *" 
  
  # 允许手动点击运行
  workflow_dispatch:
  
  # 当master分支有代码提交时，也自动运行一次
  push:
    branches:
    - master
    
# 执行任务
jobs:
  generate:
    runs-on: ubuntu-latest  # 运行环境（固定不用改）
    timeout-minutes: 10     # 最大超时时间（固定不用改）
    
    steps:
      # 第一步：生成贪吃蛇动画（生成浅色+深色两张SVG图片）
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}  # 自动获取你的GitHub用户名（不用改）
          outputs: |
            dist/github-contribution-grid-snake.svg          # 浅色模式动画
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark  # 深色模式动画
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # GitHub自动提供的密钥（不用改）
          
      # 第二步：把生成的动画上传到 output 分支（用于README显示）
      # 重要：v3.1.0 已弃用，会报Node.js警告，必须改成 v4
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4  # 👈 已修复为最新版v4，无警告
        with:
          target_branch: output   # 上传到 output 分支（不用改）
          build_dir: dist         # 从dist文件夹读取文件（不用改）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # 权限密钥（不用改）
